name: Deploy

# Runs after CI passes on main, or by hand from the Actions tab (Run workflow).
#   1. sam deploy: the extract and load Lambdas, the extract state machines and their schedules (template.yaml,
#      settings in samconfig.toml). It uses the existing bucket, Redshift, SNS topic and queue and never deletes them.
#   2. the existing dispatcher and Teams notifier Lambdas get their new code; their settings are left as they are.
# Step 1 goes first so the load Lambdas exist before the new dispatcher starts invoking them.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # GitHub signs in to AWS with OIDC, no stored keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::655103423742:role/github-deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy exactly the commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Check everything before changing anything, so a bad setting can't leave half the pipeline deployed
      - name: Pre-flight checks
        run: |
          set -euo pipefail
          if grep -n CHANGE_ME samconfig.toml; then
            echo "::error::samconfig.toml still has CHANGE_ME values; fill them in from the Glue jobs' parameters"
            exit 1
          fi
          for fn in coldstone-teams-notifier coldstone-load-dispatcher; do
            handler=$(aws lambda get-function-configuration --function-name "$fn" --query Handler --output text)
            if [[ "$handler" != "handler.lambda_handler" ]]; then
              echo "::error::$fn's handler is '$handler'. Set it to handler.lambda_handler (Code tab > Runtime settings > Edit), or the uploaded code won't be found"
              exit 1
            fi
            echo "$fn handler OK"
          done

      - name: Build the Lambda code and layer
        run: python deploy/build_lambdas.py

      - name: Deploy the pipeline stack (SAM)
        run: sam deploy --no-progressbar

      - name: Deploy the dispatcher and Teams notifier
        run: |
          set -euo pipefail
          deploy() {  # deploy <lambda function> <folder under lambda/>
            zip -j "$2.zip" "lambda/$2/handler.py"
            aws lambda update-function-code --function-name "$1" --zip-file "fileb://$2.zip" \
              --query '[FunctionName, CodeSha256]' --output text
            aws lambda wait function-updated --function-name "$1"
            echo "$1: updated"
          }
          deploy coldstone-teams-notifier  teams_notifier
          deploy coldstone-load-dispatcher load_dispatcher
