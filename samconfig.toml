# Settings for `sam deploy` (run by .github/workflows/deploy.yml, or by hand after `python deploy/build_lambdas.py`).
# Fill in every CHANGE_ME with the values the Glue jobs used: AWS Glue > ETL jobs > the job > Job details >
# Advanced properties > Job parameters. None of these are secrets (the API keys stay in SSM).
version = 0.1

[default.deploy.parameters]
stack_name = "coldstone-pipeline"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
# The code packages go to the existing bucket, in their own folder beside the data
s3_bucket = "eatngo-coldstone-web-prod"                      # same as S3Bucket below
s3_prefix = "deploy/coldstone-pipeline"
parameter_overrides = [
  "S3Bucket=eatngo-coldstone-web-prod",                      # --S3_BUCKET
  "RedshiftWorkgroup=eatngo-analytics",             # --REDSHIFT_WORKGROUP (load jobs)
  "PipelineTopicArn=arn:aws:sns:us-east-1:655103423742:coldstone-pipeline-alerts",              # --SNS_TOPIC_ARN, arn:aws:sns:us-east-1:655103423742:...
  "DispatcherRoleName=coldstone-load-dispatcher-role-c0583g6z",            # Lambda > coldstone-load-dispatcher > Configuration > Permissions > Role name
  "CopyRoleArn=default",                     # --COPY_ROLE_ARN (load jobs) if they set one
  # Only if the Glue jobs used something other than these defaults:
  "NgS3Prefix=coldstone_web_ng",
  "KyS3Prefix=coldstone_web_ky",
  "NgKeyParam=COLDSTONE_KEY-NG",
  "KyKeyParam=COLDSTONE_KEY-KY",
  "RedshiftDatabase=coldstone_web",
  "LoadQueueName=coldstone-load-queue",
  "NgParts=2",
  "ScheduleState=ENABLED",
]
